# 複製為 config.yml，再填入部署值。實際設定檔由 Git 忽略。
server:
  public_origin: "https://portal.example.invalid"  # 瀏覽器使用的協定與主機，可含 port
  prefix: "/case-investigator"
  bind_host: "127.0.0.1"
  port: 8000
  state_dir: "/var/lib/case-investigator"         # 案件資料庫、執行鎖及 session 簽章金鑰

logging:
  # directory: "/var/log/case-investigator"  # 預設為 server.state_dir 下的 logs
  retention_days: 14

gitea:
  url: "https://gitea.example.invalid"
  token: ""  # 選填，搜尋與 Git 抓取共用的 personal access token；留空時搜尋使用登入管理員的 OAuth token
  client_id: ""
  client_secret: ""

access_policy:
  account_email_domains:         # 精確比對 @ 右側，忽略大小寫
    - "example.invalid"
  excluded_account_prefixes:     # 比對 @ 左側的開頭，優先排除。無排除規則時填 []
    - "y_"

opencode:
  local_site: "local"             # 報案頁顯示的本機名稱，可自行修改
  url: "http://127.0.0.1:4096"   # OpenCode Server
  # model: "provider/model-id"     # 選填；model ID 本身可含斜線
  # username: "opencode"          # 啟用 Basic Auth 時填入
  # password: ""
  # 本機使用上面的 url，在網站主機處理檔案。啟用第二個站點後，報案時須選主機。
  # ssh_sites:
  #   remote:                    # 固定代號，供既有案件與程式索引定位站點
  #     name: "remote"            # 顯示名稱，省略時使用上方代號
  #     url: "http://remote.example.invalid:4096"
  #     target: "investigator@remote.example.invalid"  # 可用 ~/.ssh/config 別名
  #     python: "/usr/local/python/3.9.10/bin/python3.9"  # 遠端主機上的直譯器絕對路徑，省略時使用 python3
  #     ssh_password: ""          # SSH 登入密碼；留空使用既有 SSH key／agent
  #     host_key_checking: "accept-new"  # 首次連線保存金鑰；省略時使用 strict
  #     known_hosts: "/var/lib/case-investigator/ssh_known_hosts"  # 選填
  #     username: "opencode"  # 選填，預設沿用上方 OpenCode 帳密
  #     password: ""

traefik:
  upstream: "http://127.0.0.1:8000"  # 從 Traefik 主機看到的服務位址
