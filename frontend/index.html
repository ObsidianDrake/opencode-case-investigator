<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>程式查案台</title><link rel="stylesheet" href="assets/style.css"><script src="assets/app.js" defer></script></head>
<body><header><strong>程式查案台</strong><span id="account"></span><button id="logout" hidden>登出</button></header>
<main><p id="status" role="status"></p><section id="login" hidden><h1>查詢程式執行異常</h1><a class="primary" href="auth/login">使用 Gitea 登入</a></section>
<div id="workspace" hidden><aside><button id="new">＋ 建立案件</button><h2>案件紀錄</h2><nav id="cases"></nav><button id="manage" hidden>管理程式索引</button></aside>
<article><section id="intake"><h1>建立案件</h1><form id="report"><label>執行的程式<select name="program" required></select></label><label>程式執行位置<input name="folder" placeholder="執行程式時所在的資料夾" required></label><label>遇到什麼狀況<textarea name="text" required maxlength="16000" placeholder="可以先描述你看到的現象，稍後再補充。"></textarea></label><label>附上圖片<input name="image" type="file" accept="image/png,image/jpeg"></label><button class="primary">開始調查</button></form></section>
<section id="thread" hidden><h1 id="title"></h1><p id="meta"></p><div id="messages"></div><form id="reply"><label>補充訊息<textarea name="text" required maxlength="16000"></textarea></label><label>附上圖片<input name="image" type="file" accept="image/png,image/jpeg"></label><button class="primary">送出</button></form><button id="retry" hidden>重新取得回覆</button></section>
<section id="admin" hidden><h1>程式索引</h1><div id="programs"></div><form id="mapping"><label>程式名稱<input name="name" required></label><label>Gitea repository<input name="repo" placeholder="owner/repository" required></label><label>分支<select name="branch"><option>main</option><option>master</option></select></label><label>入口檔（選填）<input name="entry" placeholder="repository 內相對路徑"></label><button class="primary">儲存</button><button type="reset">清除</button></form></section>
</article></div></main></body></html>
